name: Update Pawapuro DB

on:
  schedule:
    # 毎週水曜 10:30 JST (= 01:30 UTC) に自動実行
    - cron: '30 1 * * 3'
  workflow_dispatch:  # GitHub上からの手動実行も可能

permissions:
  contents: write  # 更新後のファイルをcommitするのに必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: スクレイピング & HTML再ビルド
        run: python update.py

      - name: 差分があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters.json index.html details/
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -m "auto: characters update $(date -u +'%Y-%m-%d')"
            git push
            echo "✓ Updated and pushed."
          else
            echo "= No changes."
          fi
